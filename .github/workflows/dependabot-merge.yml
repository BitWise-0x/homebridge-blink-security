name: Dependabot Auto Merge
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
      - name: Mint App token
        id: apptoken
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      - name: Enable auto-merge for patch and minor Dependabot PRs
        # Gate on update-type alone. fetch-metadata@v3 sets update-type to the
        # highest semver change in the PR, group PRs included, so a group that
        # carries any major reports semver-major and is held for a manual merge.
        # The dependency-group clauses were the fallback for an older metadata
        # action that left update-type empty on group PRs; dropping them means
        # an empty update-type now holds instead of auto-merging (fail closed).
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          # Merges made with GITHUB_TOKEN do not trigger push workflows, so the
          # merged commit would land on main without Build or Release running.
          # The bitwise-ci App token triggers them (App is on the ruleset bypass).
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
