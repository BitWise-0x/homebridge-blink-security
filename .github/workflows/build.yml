name: Build and Lint

# Pull requests already run on pull_request; limiting push to the release
# branches stops every Dependabot branch from running the matrix twice.
on:
  push:
    branches:
      - main
      - beta
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm clean-install

      - name: Check formatting
        run: npm run prettier

      - name: Lint the project
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build the project
        run: npm run build
