# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      time: '04:00'
      timezone: 'America/New_York'
    groups:
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      production-dependencies-major-updates:
        dependency-type: 'production'
        update-types:
          - 'major'
      development-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
        # prettier minors change formatting output, which fails prettier --check
        # and wedges the whole group. It gets its own PR instead.
        exclude-patterns:
          - 'prettier'
      development-dependencies-major-updates:
        dependency-type: 'development'
        update-types:
          - 'major'
    ignore:
      # @typescript-eslint peers cap at typescript <6.1.0, so a major bump to 7
      # fails npm ci for the whole group. Drop this once their peer range moves.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
